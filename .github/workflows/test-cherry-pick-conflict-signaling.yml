name: Test cherry-pick conflict signaling

# Fork-only helper to verify [DO NOT MERGE] title + cherry-pick-conflict label.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prepare-conflict:
    runs-on: ubuntu-latest
    outputs:
      target-branch: ${{ steps.setup.outputs.target-branch }}
      commit-sha: ${{ steps.setup.outputs.commit-sha }}
      commit-message: ${{ steps.setup.outputs.commit-message }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create conflicting commit against a throwaway target branch
        id: setup
        run: |
          set -euo pipefail
          TARGET_BRANCH="branch-cp-signaling-target"
          PROBE="docs/ci-cherry-pick-signaling-probe.md"
          MSG="[TEST] probe commit for cherry-pick conflict signaling"

          git fetch origin main
          git checkout -B "$TARGET_BRANCH" origin/main
          printf '%s\n' 'content-on-target' > "$PROBE"
          git add "$PROBE"
          git commit -m "test: seed probe file on target branch"
          git push -f origin "$TARGET_BRANCH"

          # Diverging change from the same parent tip as before the target commit...
          # Rebuild source commit from origin/main so cherry-pick into TARGET conflicts.
          git checkout -B "tmp-cp-signaling-source" origin/main
          printf '%s\n' 'content-on-source' > "$PROBE"
          git add "$PROBE"
          git commit -m "$MSG"
          SOURCE_SHA="$(git rev-parse HEAD)"
          git push -f origin "tmp-cp-signaling-source"

          echo "target-branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "commit-message=$MSG" >> "$GITHUB_OUTPUT"
          echo "Prepared conflict: cherry-pick $SOURCE_SHA onto $TARGET_BRANCH"

  cherry-pick:
    needs: prepare-conflict
    uses: ./.github/workflows/cherry-pick-branch.yml
    with:
      target-branch: ${{ needs.prepare-conflict.outputs.target-branch }}
      commit-sha: ${{ needs.prepare-conflict.outputs.commit-sha }}
      commit-message: ${{ needs.prepare-conflict.outputs.commit-message }}
    secrets: inherit
