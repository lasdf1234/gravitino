---

paths:
  /secrets/providers:
    get:
      tags:
        - secrets
      summary: List configured secret providers
      operationId: listSecretProviders
      responses:
        "200":
          description: Returns configured secret providers
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/SecretProviderListResponse"
              examples:
                SecretProviderList:
                  $ref: "#/components/examples/SecretProviderList"

components:
  schemas:
    SecretProviderListResponse:
      allOf:
        - $ref: "./openapi.yaml#/components/schemas/BaseResponse"
        - type: object
          required:
            - providers
          properties:
            providers:
              type: array
              description: Configured secret providers
              items:
                $ref: "#/components/schemas/SecretProvider"

    SecretProvider:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: The configured provider name
        type:
          type: string
          description: The provider type identifier

    SecretReferenceLocator:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          description: The configured secret provider name
        mount:
          type: string
          description: Optional mount or namespace within the external store
          nullable: true
        path:
          type: string
          description: Optional path to the secret within the external store
          nullable: true

  examples:
    SecretProviderList:
      value:
        code: 0
        providers:
          - name: memory
            type: memory
